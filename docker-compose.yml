services:
  backend:
    build:
      context: ./backend
    container_name: tina-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    container_name: tina-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
